# ─────────────────────────────
# Material You Hyprlock Rice
# ─────────────────────────────

background {
    path = $HOME/.config/hypr/wallpapers/wallpaper4.jpg 
    color = rgba(0,0,0,100)
    blur_passes = 3
    blur_size = 10
    brightness = 0.9
}


general {
    hide_cursor = false
    immediate_render = true
}

# -------- DATE --------
label {
    text = cmd[update:1] echo "<b>$(date +'%A, %d %B %Y')</b>"
    color = rgba(230,230,230,0.85)
    font_size = 22
    font_family = "FiraCode Nerd Font"
    position = 0, -450
    halign = center
    valign = center
}

# -------- MAIN CLOCK --------
label {
    text = cmd[update:1] echo "$(date +'%H:%M')"
    color = rgba(255,190,120,0.95)
    font_size = 200
    font_family = "FiraCode Nerd Font"
    position = 0, -100
    halign = center
    valign = center
}

# -------- SYSTEM INFO (Fixed Single-Line) --------
label {
    text = cmd[update:1] bash -c 'cpu=$(awk -F": " "/model name/ {print \$2; exit}" /proc/cpuinfo); ram=$(free -h | awk "/Mem/ {print \$3\"/\"\$2}"); disk=$(df -h / | awk "NR==2 {print \$3\"/\"\$2}"); net=$(nmcli -t -f ACTIVE,SSID dev wifi | grep "^yes" | cut -d: -f2 | sed "s/^$/Offline/"); bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo N/A); up=$(uptime -p); echo "  $cpu  |󰍛 $ram  |  $disk  |   $net  | 🔋 $bat%  |  $up"'
    color = rgba(220,220,220,0.85)
    font_size = 22
    font_family = "FiraCode Nerd Font"
    position = 0, 200
    halign = center
    valign = center
}

# -------- INPUT FIELD --------
input-field {
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(255,190,120,0.85)
    inner_color = rgba(255,255,255,0.05)
    font_color = rgba(240,240,240,0.9)
    capslock_color = rgba(255,100,100,0.9)

    placeholder_text = 🔒 Enter Password
    hide_input = false       # keep false so dots show
    fade_on_empty = false
    position = 0, 350
    halign = center
    valign = center
}


# -------- USER --------
label {
    text = "  $USER"
    color = rgba(255,255,255,0.9)
    font_size = 22
    font_family = "FiraCode Nerd Font"
    position = 0, 430
    halign = center
    valign = center
}

# -------- HOST / OS INFO --------
label {
    text = cmd[update:1] bash -c 'host=$(hostnamectl hostname); kernel=$(uname -r); os=$(grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d "\""); echo "$host • $kernel • $os"'
    color = rgba(255,255,255,0.7)
    font_size = 18
    font_family = "FiraCode Nerd Font"
    position = 0, -600
    halign = center
    valign = center
}

