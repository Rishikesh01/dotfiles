general {
    # Avoid starting multiple hyprlock instances
    lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock

    # Lock before suspend
    before_sleep_cmd = pgrep -x hyprlock >/dev/null || hyprlock

    # Wake the display properly after resume
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                                # 2.5min
    on-timeout = brightnessctl -s set 10         # dim monitor backlight (avoid 0 on OLED)
    on-resume  = brightnessctl -r                # restore backlight
}

listener {
    timeout = 300                                # 5min
    on-timeout = pgrep -x hyprlock >/dev/null || hyprlock   # lock screen
}

listener {
    timeout = 330                                # 5.5min
    # add a small delay to prevent DPMS race conditions
    on-timeout = bash -c 'sleep 0.2 && hyprctl dispatch dpms off'
    on-resume  = bash -c 'sleep 0.3 && hyprctl dispatch dpms on && brightnessctl -r'
}

