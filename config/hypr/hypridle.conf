general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = $HOME/.config/hypr/scripts/hypr-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}



listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = $HOME/.config/hypr/scripts/hypr-dispatch 'hl.dsp.dpms({ action = "off" })' dpms off   # screen off when timeout has passed
    on-resume = sleep 1 && $HOME/.config/hypr/scripts/hypr-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on && brightnessctl -r   # screen on when activity is detected after timeout has fired.
}
